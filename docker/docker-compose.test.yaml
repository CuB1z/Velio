# Complete TEST stack: isolated project name, its own database volume,
# dev conveniences on (OTP_TEST_MODE) and rate limiting backed by Redis.
# Run it INSTEAD of the main stack.
#
#   docker compose -f docker/docker-compose.test.yaml up -d --build api   (from the repo root)
#
# Relative paths resolve against THIS file's folder, hence the ../ prefixes.

name: velio-test

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: velio-db-test
    environment:
      POSTGRES_DB: cycling_router
      POSTGRES_USER: cycling
      POSTGRES_PASSWORD: cycling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cycling -d cycling_router"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.8.2
    container_name: valhalla-test
    command:
      - valhalla_service
      - /data/config/valhalla.json
      - "4"
    ports:
      - "8002:8002"
    volumes:
      - ../backend/valhalla:/data
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: velio-api-test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started
    environment:
      ENV: dev
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      OTP_TEST_MODE: "true"
      RATE_LIMIT_ENABLED: "false"
      RATE_LIMIT_BACKEND: memory
      REDIS_URL: redis://redis:6379/0
      VALHALLA_URL: http://valhalla:8002
      VALHALLA_ELEVATION_DIR: /data/elevation
      DB_DRIVER: postgresql+asyncpg
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: cycling
      DB_PASSWORD: cycling
      DB_NAME: cycling_router
      CORS_ORIGINS: '["*"]'
      MAIL_FROM: no-reply@localhost
      # --env-file only feeds YAML interpolation: variables not declared here
      # never reach the container.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_REDIRECT_BASE: ${AUTH_REDIRECT_BASE:-http://localhost:8000}
      OAUTH_SUCCESS_REDIRECT: ${OAUTH_SUCCESS_REDIRECT:-}
    ports:
      - "8000:8000"
    volumes:
      - ../backend/valhalla/elevation:/data/elevation:ro
    restart: unless-stopped

volumes:
  pgdata:
