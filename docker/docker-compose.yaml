# Main stack compose: services and wiring only. Application configuration
# comes from your environment at launch time:
#
#   docker compose --env-file .env -f docker/docker-compose.yaml up -d --build api

name: velio

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.8.2
    container_name: valhalla-router

    command:
      - valhalla_service
      - /data/config/valhalla.json
      - "4"

    ports:
      - "8002:8002"

    volumes:
      - ../valhalla:/data

    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: velio-db

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cycling -d cycling_router"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: velio-api

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started

    environment:
      ENV: ${ENV}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND}
      REDIS_URL: ${REDIS_URL}
      VALHALLA_URL: ${VALHALLA_URL}
      VALHALLA_ELEVATION_DIR: ${VALHALLA_ELEVATION_DIR}
      DB_DRIVER: ${DB_DRIVER}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      AUTH_REDIRECT_BASE: ${AUTH_REDIRECT_BASE}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_LIST_ID: ${BREVO_LIST_ID}
      MAIL_FROM: ${MAIL_FROM}

    ports:
      - "8000:8000"

    volumes:
      - ../valhalla/elevation:/data/elevation:ro

    restart: unless-stopped

volumes:
  pgdata:
