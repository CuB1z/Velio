# Main stack compose. Lives inside docker/ alongside the test variant;
# relative paths point one level up at repo-root assets.
#
#   docker compose -f docker/docker-compose.yaml up -d --build api

name: velio

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla:3.8.2
    container_name: valhalla-router

    command:
      - valhalla_service
      - /data/config/valhalla.json
      - "4"

    ports:
      - "8002:8002"

    volumes:
      - ../valhalla:/data

    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: velio-db

    environment:
      POSTGRES_USER: cycling
      POSTGRES_PASSWORD: cycling
      POSTGRES_DB: cycling_router

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cycling -d cycling_router"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: velio-api

    env_file:
      - ../.env

    environment:
      ENV: dev
      VALHALLA_URL: http://valhalla-router:8002
      VALHALLA_ELEVATION_DIR: /data/elevation
      DB_DRIVER: postgresql+asyncpg
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: cycling
      DB_PASSWORD: cycling
      DB_NAME: cycling_router

    ports:
      - "8000:8000"

    volumes:
      - ../valhalla/elevation:/data/elevation:ro

    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_started

    restart: unless-stopped

volumes:
  pgdata:
