<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Velio builds loop and point-to-point cycling routes from real surface, safety and elevation data." />
    <title>Velio</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Velio" />
    <meta property="og:title" content="Velio · Loops cut to your distance, scored before you ride." />
    <meta property="og:description" content="Velio builds loop and point-to-point cycling routes from real surface, safety and elevation data." />
    <meta property="og:url" content="https://velio.cub1z.es/" />
    <meta property="og:image" content="https://velio.cub1z.es/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Loops cut to your distance, scored before you ride: the Velio tagline over the elevation profile of a real loop" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the theme before first paint to avoid a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('velio.theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.classList.toggle('light', !dark)
          var lang = location.pathname.split('/')[1]
          if (/^[a-z]{2}$/.test(lang)) document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
