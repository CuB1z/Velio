name: CD - Publish release

on:
  release:
    types: [published]

jobs:
  release-tag:
    uses: ./.github/workflows/cd-build.yaml
    secrets: inherit
    with:
      tag: ${{ github.event.release.tag_name }}

  release-latest:
    needs: release-tag
    uses: ./.github/workflows/cd-build.yaml
    secrets: inherit
    with:
      tag: latest

  deploy:
    needs: release-latest
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_AUTH_TOKEN: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [[ -n "$DOKPLOY_URL" && -n "$DOKPLOY_AUTH_TOKEN" && -n "$DOKPLOY_COMPOSE_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dokploy deployment
        if: steps.check.outputs.configured == 'true'
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: compose

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Wait for the release on velio.cub1z.es
        if: steps.check.outputs.configured == 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          want="${TAG#v}"
          got=""
          for _ in $(seq 1 90); do
            got=$(curl -sf https://velio.cub1z.es/api/health | jq -r .version || true)
            if [ "$got" = "$want" ]; then
              echo "velio.cub1z.es runs $got"
              exit 0
            fi
            sleep 10
          done
          echo "velio.cub1z.es still reports '${got:-nothing}' after 15 minutes; expected $want (the backend version in backend/app/core/config.py)"
          exit 1

      - name: Smoke test
        if: steps.check.outputs.configured == 'true'
        run: frontend/scripts/smoke.sh https://velio.cub1z.es
