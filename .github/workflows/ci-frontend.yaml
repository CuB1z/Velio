name: CI - Frontend

on:
  pull_request:
    paths: [frontend/**, .github/workflows/ci-frontend.yaml]
  push:
    branches: [dev, main]
    paths: [frontend/**, .github/workflows/ci-frontend.yaml]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
