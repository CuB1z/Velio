<!DOCTYPE html>
<html lang="$lang">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <title>$subject</title>
</head>
<body style="margin:0;padding:0;background-color:#000000;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#000000;">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;background-color:#0c0c0c;border:1px solid #202020;border-radius:16px;">
          <tr>
            <td style="padding:40px 40px 32px;">
              <img src="$logo_url" width="87" height="28" alt="Velio" style="display:block;border:0;height:28px;width:auto;" />
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;line-height:30px;font-weight:600;letter-spacing:-0.4px;color:#ffffff;">
              $heading
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#a3a3a3;">
              $intro
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="background-color:#d1ec31;border-radius:12px;padding:20px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:36px;line-height:40px;font-weight:600;letter-spacing:10px;color:#000000;font-variant-numeric:tabular-nums;">
                    $code
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 40px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#a3a3a3;">
              $expiry
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 36px;border-top:1px solid #202020;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#a3a3a3;">
              $ignore
            </td>
          </tr>
        </table>
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">
          <tr>
            <td align="center" style="padding:24px 16px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#a3a3a3;">
              <a href="$site_url" style="color:#a3a3a3;text-decoration:none;">$site_label</a>
              &nbsp;·&nbsp;
              <a href="$privacy_url" style="color:#a3a3a3;text-decoration:underline;">$privacy_label</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
