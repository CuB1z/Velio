<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Velio account deletion code</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:480px;max-width:100%;background-color:#ffffff;border-radius:12px;">
          <tr>
            <td style="padding:40px 40px 24px;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#007bff;">Velio</td>
          </tr>
          <tr>
            <td style="padding:0 40px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#222222;">
              We received a request to delete your <strong>Velio</strong> account.
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 8px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#6b7280;">
              Your account deletion code is:
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 40px 24px;">
              <div style="background-color:#f4f5f7;border-radius:8px;padding:16px 32px;font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:bold;letter-spacing:8px;color:#222222;">$code</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#6b7280;">
              It expires in $expire_minutes minutes.
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 40px;border-top:1px solid #e5e7eb;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#9ca3af;">
              If you did not request this, you can ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
